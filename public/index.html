<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<title>Feedback Loop</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css?v=1">
</head>
<body>
<header>
  <h1>Feedback Loop</h1>
  <nav class="counts">
    <span class="dot pending"></span><span id="pct">0</span>
    <span class="dot running"></span><span id="rct">0</span>
    <span class="dot failed"></span><span id="fct">0</span>
  </nav>
</header>
<main>
  <section class="form-section">
    <h2>File a bug</h2>
    <form id="bug-form">
      <input type="text" id="title" placeholder="Title" required autocomplete="off">
      <textarea id="description" placeholder="Description — stack traces, steps, expected behaviour" required rows="4"></textarea>
      <input type="text" id="repo-path" placeholder="Repo path (~/projects/my-app)" required autocomplete="off">
      <button type="submit">Submit</button>
      <div class="form-err" id="form-err"></div>
    </form>
  </section>
  <section class="queue-section">
    <h2>Queue <span id="queue-count"></span></h2>
    <div id="queue"></div>
  </section>
</main>
<script src="/app.js?v=1"></script>
</body>
</html>
